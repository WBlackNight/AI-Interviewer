# 注意：本文件仅在「可自由访问国内镜像」的环境下启用。
#
# WorkBuddy 沙箱环境设有出口代理（http_proxy=127.0.0.1:64405），
# 代理按域名白名单放行 —— 国内镜像源（清华/阿里）会被返回 403，
# 官方 pypi.org 在白名单内。因此沙箱内请勿使用本文件，直接用：
#
#   pip install -r requirements.txt -i https://pypi.org/simple --timeout 60 --retries 3
#
# 若在本地/校园网等无代理限制环境，将本文件复制为 pip.ini 可加速：
[global]
index-url = https://pypi.tuna.tsinghua.edu.cn/simple
timeout = 120
retries = 5
disable-pip-version-check = true

name: Verify interview and offline retrieval
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LLM_API_KEY: ""
      JUDGE0_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
      - run: python -m pytest evals/test_native_home_gateway.py -q
      - run: python evals/build_question_index.py
      - run: python evals/build_question_index.py
      - run: python evals/retrieval_eval.py --output retrieval-eval.json
      - run: python evals/smoke_e2e.py --start-server --restart
      - run: python evals/smoke_e2e.py --start-server --restart --pdf
      - run: python evals/smoke_e2e.py --start-server --restart --pdf --retrieval hybrid
      - run: python evals/smoke_e2e.py --start-server --restart --retrieval vector
      - run: python evals/smoke_e2e.py --start-server --restart --position python_backend --retrieval hybrid
      - run: python evals/practice_smoke.py
      - run: python evals/account_smoke.py
      - run: python evals/history_filters_smoke.py
      - run: python evals/dashboard_smoke.py
      - run: python evals/catalog_smoke.py
      - run: python evals/question_marks_smoke.py
      - run: python evals/coverage_smoke.py
      - run: python evals/preparation_smoke.py
      - run: python evals/audit_question_bank.py --candidates data/question_candidates
      - run: python evals/cancellation_smoke.py
      - run: python evals/revision_smoke.py
      - run: python evals/revision_practice_smoke.py
      - run: python evals/revision_schedule_smoke.py
      - run: python evals/revision_notes_smoke.py
      - run: python tools/test_project.py
      - run: python tools/project.py check
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend

<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>练习记录 · 青栈 QINGZHAN</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/assets/home.css"><script src="/assets/history.js" defer></script></head>
<body class="notes-page">
  <a class="skip" href="#history-main">跳到主要内容</a><header class="nav"><div class="container notes-nav"><a class="brand" href="/" aria-label="青栈首页"><svg width="25" height="25" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 5h20v14H13l-6 5v-5H4zM9 10h10M9 14h6"/></svg><span class="brand-mark">青栈</span><span class="brand-en">QINGZHAN</span></a><!-- @workspace-navigation --></div></header>
  <main class="container notes-main board-main" id="history-main"><section class="notes-intro board-intro" aria-labelledby="history-title"><div><p class="eyebrow">YOUR PRACTICE JOURNAL</p><h1 id="history-title">每一次练过的，<br>都能接着往下走。</h1></div><div><p class="sec-lead">继续未结束的练习，或回看报告，找到下一次要补充的地方。</p><p id="history-scope" class="notes-boundary">正在读取当前标签页的访问范围…</p><a href="/account" class="link-arrow">账户与登录 ↗</a></div></section>
    <!-- 记录筛选：账户由服务端筛选；匿名只读取当前标签页已有的合法凭据。 -->
    <section id="history-toolbar" class="notes-toolbar" aria-label="练习记录筛选"><form id="history-filters"><label for="history-position">岗位<select id="history-position"><option value="">全部岗位</option></select></label><label for="history-difficulty">练习强度<select id="history-difficulty"><option value="">全部强度</option><option value="easy">轻松</option><option value="mid">标准</option><option value="hard">挑战</option></select></label><button type="submit" class="notes-button notes-primary">应用筛选</button><button type="button" id="history-reset" class="notes-button">重置筛选</button><button type="button" id="history-refresh" class="notes-button">刷新记录</button><a href="/review" class="link-arrow" id="history-review" hidden>同岗位跨场复盘 ↗</a></form><div class="board-date-tabs" role="group" aria-label="面试状态"><button type="button" class="notes-button" data-status="all" aria-pressed="true">全部记录</button><button type="button" class="notes-button" data-status="running" aria-pressed="false">进行中</button><button type="button" class="notes-button" data-status="created" aria-pressed="false">尚未开始</button><button type="button" class="notes-button" data-status="finished" aria-pressed="false">已完成</button><button type="button" class="notes-button" data-status="cancelled" aria-pressed="false">已取消</button></div></section>
    <p id="history-alert" role="alert" class="notes-alert"></p><p id="history-notice" role="status" class="board-notice"></p><p id="history-loading" role="status" hidden>正在读取练习记录…</p>
    <!-- 匿名认领：逐场操作，说明凭据失效边界，最多显示五项以控制页面规模。 -->
    <section id="history-claims" class="history-claims" hidden aria-labelledby="history-claims-title"><h2 id="history-claims-title">把本标签页的匿名练习带到账户中</h2><p>逐场认领后，原匿名凭据失效，该场面试改为通过当前账户访问；不会同时认领原简历。</p><ul id="history-claim-list"></ul><button id="history-claims-next" type="button" class="notes-button" hidden>查看下一组匿名练习</button></section>
    <section id="history-empty" class="notes-message" hidden aria-labelledby="history-empty-title"><h2 id="history-empty-title">当前筛选下没有练习记录。</h2><p>可以调整筛选，或从首页开始新的一场。</p><a href="/#start" class="link-arrow">开始练习 ↗</a></section><section id="history-list" class="notes-list" aria-label="面试与报告记录"></section><nav id="history-pagination" class="notes-pagination" aria-label="记录分页" hidden><button id="history-previous" type="button" class="notes-button">上一页</button><span id="history-page"></span><button id="history-next" type="button" class="notes-button">下一页</button></nav>
  </main>
  <!-- 取消与删除分别确认：撤回不发送写请求，进行中记录沿用服务端删除保护。 -->
  <dialog id="history-confirm" class="notes-discard" aria-labelledby="history-confirm-title"><h2 id="history-confirm-title"></h2><p id="history-confirm-copy" data-delete="将删除此场面试、报告及其来源复习任务和笔记，不能在产品内恢复；已创建的独立专项保留。" data-cancel="取消后不能继续本场。已提交回答和部分报告保留，未提交输入不会上传。"></p><p id="history-confirm-error" class="notes-alert" role="alert"></p><div class="note-actions"><button id="history-confirm-back" type="button" class="notes-button" autofocus>返回记录</button><button id="history-confirm-submit" type="button" class="notes-button danger-button"></button></div></dialog>
  <footer class="site-foot"><div class="container foot-row"><span>青栈 QINGZHAN · 留下证据，接着练习。</span><a href="/revision">回到复习任务 ↗</a></div></footer><noscript><p class="no-script">开启JavaScript后可读取账户或当前标签页的匿名练习记录。</p></noscript>
</body>
</html>
